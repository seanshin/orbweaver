name: CI

# Licensing: omniORB, TAO and JacORB are LGPL/GPL/DOC. They are installed into
# the ephemeral runner and used only as (a) external programs whose text output
# we read and (b) separate-process wire peers over TCP. Nothing here links them
# into Orbweaver, and no image or artifact containing them is published —
# publishing would be redistribution. See docs/PLAN.md §10.
#
# Installs are best-effort (`|| true`) on purpose: the harness scripts decide
# whether an oracle or peer is present, because they are the ones that know
# whether its absence is a skip or a failure. An apt step that aborts the job
# tells you a package name was wrong and nothing about the code.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Everything that needs no fixture. Fast, and gates the rest. ────────────
  rust:
    name: build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo test --workspace
        env:
          RUSTFLAGS: -D warnings

      # NOTICE promises that --no-default-features drops encoding_rs and the
      # BSD-3-Clause attribution with it. A promise that is testable is tested.
      - name: attribution-free build
        run: cargo test -p orbweaver-giop --lib --no-default-features
        env:
          RUSTFLAGS: -D warnings

      # The licensing boundary is the one rule that cannot be renegotiated
      # later, so it is checked mechanically rather than trusted to review.
      - name: licence boundary
        run: |
          if cargo tree --workspace | grep -qiE "omniorb|jacorb|\btao\b"; then
            echo "::error::an ORB fixture has become a dependency"; exit 1
          fi
          if cargo tree -p orbweaver-giop --no-default-features | grep -q encoding_rs; then
            echo "::error::--no-default-features still pulls encoding_rs; NOTICE is wrong"; exit 1
          fi
          echo "cargo tree is free of ORB fixtures"

  # ── The differential oracle: two independent deployed IDL compilers. ───────
  differential:
    name: differential conformance (omniidl + JacORB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-diff-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-diff-${{ runner.os }}-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # TAO is deliberately not installed: Ubuntu has no tao-idl package, which
      # the first run of this workflow established rather than assumed. The
      # script picks it up if a future runner has it; JacORB's IDL compiler is
      # the second oracle in the meantime, and being an independent Java
      # implementation it serves the same purpose.
      - name: install omniidl
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends omniidl || true

      - name: fetch the JacORB IDL compiler
        env:
          JAVA_HOME_21: ${{ env.JAVA_HOME }}
        run: ./spikes/jacorb/setup.sh --jars-only

      # --require makes a missing oracle a failure rather than a skip. On a
      # laptop one oracle is normal; in CI an unmeasured column is a failure,
      # because a harness that reports green on something it did not run is
      # worse than no harness.
      - name: differential conformance
        env:
          JAVA_HOME_21: ${{ env.JAVA_HOME }}
        run: ./spikes/differential.sh --require omniidl,jacorb_idl

  # ── The wire: two independent ORBs, both directions. ──────────────────────
  interop:
    name: interop harness (omniORB + JacORB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-interop-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-interop-${{ runner.os }}-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # JDK 24 removed java.applet.Applet; JacORB 3.9 needs it

      # The fixtures are Python servants, so the omniORB Python binding is the
      # load-bearing piece. Two runs of this workflow established, rather than
      # assumed, that Ubuntu packages no such binding: `apt-cache search omni`
      # on noble returns omniORB's C++ libraries, omniidl and the nameserver,
      # and nothing else. omniORBpy is therefore built from source against the
      # packaged C++ core, at a version matched to it.
      - name: install the omniORB peer
        run: |
          sudo apt-get update -qq
          # omniidl-python is the IDL compiler's Python back-end, packaged
          # separately and listed only as a *suggestion* of omniidl — which is
          # why installing omniidl alone left every fixture dying on
          # "Could not import back-end 'python'".
          sudo apt-get install -y --no-install-recommends \
            omniidl omniidl-python omniorb-idl omniorb-nameserver \
            libomniorb4-dev python3-dev build-essential
          dpkg-query -W -f='${Version}\n' libomniorb4-dev
          echo "--- where the IDL back-ends actually live:"
          dpkg -L omniidl omniidl-python | grep -iE "omniidl_be|back" || true

      - name: build omniORBpy against the packaged core
        run: |
          set -x
          ver=$(dpkg-query -W -f='${Version}' libomniorb4-dev | sed 's/[+-].*//')
          echo "omniORB core is $ver; building the matching omniORBpy"
          curl -sfL --max-time 180 -o /tmp/omniORBpy.tar.bz2 \
            "https://downloads.sourceforge.net/project/omniorb/omniORBpy/omniORBpy-${ver}/omniORBpy-${ver}.tar.bz2"
          mkdir -p /tmp/opy && tar xf /tmp/omniORBpy.tar.bz2 -C /tmp/opy --strip-components=1
          cd /tmp/opy
          # omniORBpy compiles omniORB's own IDL (corbaidl.idl, ir.idl,
          # boxes.idl, pollable.idl) and looks for it under
          # $(IMPORT_TREES)/idl, which --with-omniorb=/usr makes /usr/idl.
          # Debian ships those files at /usr/share/idl/omniORB, so the build
          # failed with "couldn't find idl file corbaidl.idl" until they were
          # put where its makefiles look.
          sudo mkdir -p /usr/idl
          sudo cp -r /usr/share/idl/omniORB /usr/idl/
          ls /usr/idl/omniORB | head
          ./configure --prefix=/usr --with-omniorb=/usr
          make -j"$(nproc)"
          sudo make install
          python3 -c "import omniORB; print('omniORB python at', omniORB.__file__)"

          # omniidl loads its back-ends as submodules of one omniidl_be
          # package. Debian's sysconfig inserts "local" into the install path,
          # so omniORBpy's python back-end lands under /usr/local while the apt
          # omniidl imports omniidl_be from /usr/lib/python3/dist-packages. The
          # two directories shadow each other rather than merging, and every
          # fixture died on "Could not import back-end 'python'". Merge them.
          # Last round's search came up empty because it was restricted to
          # directories under /usr at a fixed depth. Look everywhere, and print
          # it, so a future failure here is diagnosed rather than guessed at.
          echo "--- every omniidl_be on the filesystem:"
          find / -name 'omniidl_be*' -maxdepth 8 2>/dev/null || true
          apt_be=/usr/lib/python3/dist-packages/omniidl_be
          for src in $(find /usr/local -name omniidl_be -type d 2>/dev/null); do
            [ "$src" = "$apt_be" ] && continue
            [ -d "$apt_be" ] && sudo cp -rn "$src"/. "$apt_be"/ || true
          done
          python3 -c "import omniidl_be.python; print('python back-end importable')"

      # The fixtures call omniORB.importIDL, which shells out to omniidl with
      # the python back-end. Proving that works here turns a confusing cascade
      # of "fixture did not publish an IOR" into one clear failure.
      - name: check the fixtures can compile their IDL
        run: |
          omniidl -bpython -o /tmp/idlcheck spikes/echo.idl
          python3 -c "import sys; sys.path.insert(0, '/tmp/idlcheck'); import spike; print('spike stubs generated')"

      - name: build the JacORB fixture
        env:
          JAVA_HOME_21: ${{ env.JAVA_HOME }}
        run: ./spikes/jacorb/setup.sh

      - name: harness
        env:
          JAVA_HOME_21: ${{ env.JAVA_HOME }}
        run: ./spikes/run_checks.sh
