[workspace]
resolver = "3"
members = [
    "crates/orbweaver-cdr",
    "crates/orbweaver-dynamic",
    "crates/orbweaver-giop",
    "crates/orbweaver-idl",
    "crates/orbweaver-mcp",
    "crates/orbweaver-object",
    "crates/orbweaver-registry",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/seanshin/orbweaver"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

# Warnings are errors in CI, so anything here has to be genuinely worth fixing.
# `never_loop` and `if_same_then_else` both found real misleading code in
# Phase 2 Batch 6; neither was a crash, and both said something untrue about
# the protocol to the next reader.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
