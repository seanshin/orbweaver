[workspace]
resolver = "3"
members = [
    "crates/orbweaver-cdr",
    "crates/orbweaver-console",
    "crates/orbweaver-dynamic",
    "crates/orbweaver-forge",
    "crates/orbweaver-gen",
    "crates/orbweaver-giop",
    "crates/orbweaver-idl",
    "crates/orbweaver-mcp",
    "crates/orbweaver-object",
    "crates/orbweaver-registry",
    "crates/orbweaver-test",
    "crates/orbweaver-trading",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/seanshin/orbweaver"
# 1.88, not 1.85, and measured rather than declared: the tree uses let-chains
# (stable in 1.88), and `cargo +1.85 build` fails with ten E0658s. The wrong
# figure sat here unchecked until 2026-09-03, when the container probe's
# in-image `rust:1.85-slim` build turned out to have been failing on every CI
# push — under a harness line that reported the probe as never run. The
# harness's `msrv` group builds one crate with `cargo +<this>` where that
# toolchain exists, so the figure cannot go stale silently again.
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

# Warnings are errors in CI, so anything here has to be genuinely worth fixing.
# `never_loop` and `if_same_then_else` both found real misleading code in
# Phase 2 Batch 6; neither was a crash, and both said something untrue about
# the protocol to the next reader.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
