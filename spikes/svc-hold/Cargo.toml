# A harness-only holder for the two MoE servants.
#
# It is its own workspace (the empty `[workspace]` table below) so that
# `cargo test --workspace` / `cargo fmt --check` at the repository root are
# unchanged by its existence: this package exists for `service_sweep.sh` and
# for nothing else.
#
# Why it exists at all: `spike-experts` and `spike-tenants` open their serving
# windows inside `std::thread::scope` and close them again, and neither takes
# `--hold` the way `spike-names`, `spike-events` and `spike-ifr` do. An
# external sweep therefore has no way to address either servant. Adding
# `--hold` to those two binaries is the right fix, and it is a `crates/` change
# — so it is reported rather than made, and this holder stands in.
[workspace]

[package]
name = "moe-hold"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
orbweaver-giop = { path = "../../crates/orbweaver-giop" }
orbweaver-object = { path = "../../crates/orbweaver-object" }
orbweaver-trading = { path = "../../crates/orbweaver-trading" }

[[bin]]
name = "moe-hold"
path = "src/main.rs"
