[package]
name = "orbweaver-mcp"
description = "The MCP boundary: capability handles, default-deny exposure, and the generic tool triad"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
orbweaver-cdr = { path = "../orbweaver-cdr" }
orbweaver-giop = { path = "../orbweaver-giop", default-features = false }
orbweaver-registry = { path = "../orbweaver-registry" }
orbweaver-dynamic = { path = "../orbweaver-dynamic" }
orbweaver-idl = { path = "../orbweaver-idl" }
# D024 §5's four contract tools wrap pipeline stages that already exist, so the
# boundary must be able to reach them: S4 lives in `orbweaver-forge`, `gen` in
# `orbweaver-gen`, and the §5.3 differ in `orbweaver-registry` above. Both edges
# are new on 2026-08-26 and neither is a cycle — see `orbweaver-forge`'s own
# Cargo.toml for the one that had to be reversed to make this legal.
orbweaver-forge = { path = "../orbweaver-forge" }
orbweaver-gen = { path = "../orbweaver-gen" }

[lints]
workspace = true

[[bin]]
name = "spike-mcp"
path = "src/bin/spike_mcp.rs"

[[bin]]
name = "orbweaver-mcp-server"
path = "src/bin/orbweaver_mcp_server.rs"

[[bin]]
name = "search-bench"
path = "src/bin/search_bench.rs"
