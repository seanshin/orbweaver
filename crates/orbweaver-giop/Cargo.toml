[package]
name = "orbweaver-giop"
description = "GIOP/IIOP messages, IOR handling, and a minimal synchronous invoker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
orbweaver-cdr = { path = "../orbweaver-cdr" }
# See NOTICE and docs/decisions/D001: data we cannot originate.
encoding_rs = { version = "0.8", optional = true }
# See NOTICE and docs/decisions/D002: logic whose failure modes our oracles
# cannot detect (cryptography) is depended on, not written. rustls is taken
# under the MIT arm of its triple licence; its default features bring the
# aws-lc-rs provider D002 names. Its `pki_types` re-export also covers the
# tests' PEM loading, so this is the only crate the feature adds.
rustls = { version = "0.23", optional = true }

[lints]
workspace = true

[[bin]]
name = "spike-interop"
path = "src/bin/spike_interop.rs"

[[bin]]
name = "spike-dump"
path = "src/bin/spike_dump.rs"

[features]
# EUC-KR conversion pulls in encoding_rs, whose BSD-3-Clause term covers the
# WHATWG mapping data. Default-on so Korean peers work out of the box;
# --no-default-features removes both the support and the obligation.
default = ["euc-kr"]
euc-kr = ["dep:encoding_rs"]
# Dial-TLS for SSLIOP endpoints. OFF by default, per docs/decisions/D002: a
# default build must carry no cryptography dependency and no attribution
# obligation beyond encoding_rs's. run_checks.sh tests that promise.
ssliop = ["dep:rustls"]


[[bin]]
name = "spike-naming"
path = "src/bin/spike_naming.rs"

[[bin]]
name = "spike-names"
path = "src/bin/spike_names.rs"

[[bin]]
name = "spike-fragment"
path = "src/bin/spike_fragment.rs"

[[bin]]
name = "spike-locate"
path = "src/bin/spike_locate.rs"

[[bin]]
name = "spike-failover"
path = "src/bin/spike_failover.rs"

[[bin]]
name = "spike-cancel"
path = "src/bin/spike_cancel.rs"

[[bin]]
name = "spike-events"
path = "src/bin/spike_events.rs"

[[bin]]
name = "spike-concurrent"
path = "src/bin/spike_concurrent.rs"
