[package]
name = "orbweaver-giop"
description = "GIOP/IIOP messages, IOR handling, and a minimal synchronous invoker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
orbweaver-cdr = { path = "../orbweaver-cdr" }
# See NOTICE and docs/decisions/D001: data we cannot originate.
encoding_rs = { version = "0.8", optional = true }

[lints]
workspace = true

[[bin]]
name = "spike-interop"
path = "src/bin/spike_interop.rs"

[[bin]]
name = "spike-dump"
path = "src/bin/spike_dump.rs"

[features]
# EUC-KR conversion pulls in encoding_rs, whose BSD-3-Clause term covers the
# WHATWG mapping data. Default-on so Korean peers work out of the box;
# --no-default-features removes both the support and the obligation.
default = ["euc-kr"]
euc-kr = ["dep:encoding_rs"]

[[bin]]
name = "spike-server"
path = "src/bin/spike_server.rs"

[[bin]]
name = "spike-naming"
path = "src/bin/spike_naming.rs"

[[bin]]
name = "spike-fragment"
path = "src/bin/spike_fragment.rs"
