[package]
name = "orbweaver-forge"
description = "S4, the validation gate: every deterministic check, with diagnostics a generator can act on"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
orbweaver-idl = { path = "../orbweaver-idl" }
orbweaver-registry = { path = "../orbweaver-registry" }
orbweaver-dynamic = { path = "../orbweaver-dynamic" }
orbweaver-giop = { path = "../orbweaver-giop", default-features = false }
# Cycle-free: orbweaver-mcp depends only on cdr/giop/registry/dynamic/idl,
# never on forge. S5 uses its `exposable_interfaces` so "what could be
# exposed" has exactly one definition, and the I2 tests drive its Bridge.
orbweaver-mcp = { path = "../orbweaver-mcp" }

[lints]
workspace = true

[[bin]]
name = "sidl-validate"
path = "src/bin/sidl_validate.rs"

[[bin]]
name = "forge-pipeline"
path = "src/bin/forge_pipeline.rs"

[[bin]]
name = "sidl-infer"
path = "src/bin/sidl_infer.rs"
