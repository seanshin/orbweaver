[package]
name = "orbweaver-test"
description = "S7: contract and property tests derived from the registry — seeded CDR round-trip fuzzing, and SIDL meaning checks that advise rather than gate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
orbweaver-cdr = { path = "../orbweaver-cdr" }
orbweaver-giop = { path = "../orbweaver-giop", default-features = false }
orbweaver-dynamic = { path = "../orbweaver-dynamic" }
orbweaver-registry = { path = "../orbweaver-registry" }
# D026 §5 S1: the seed loader builds `orbweaver_trading::Offer` values from
# `corpus/state/`, so the population has one home instead of being retyped at
# each fixture. Cycle-free: `orbweaver-trading` depends on nothing.
orbweaver-trading = { path = "../orbweaver-trading" }
orbweaver-idl = { path = "../orbweaver-idl" }
# The reporting vocabulary, not a second one. S4 already defines what a finding
# is and how it prints; a second Finding type would mean a caller consuming
# both had to normalise them, and the two would drift on the day one grew a
# field. Cycle-free: nothing in forge's tree depends on this crate.
orbweaver-forge = { path = "../orbweaver-forge" }
# Fuzz targets and one pinning test, never a rule's implementation.
# `orbweaver-console` owns the D004 trace reader and `orbweaver-mcp` owns the
# quota stage; both parse or act on input somebody else chose, and neither can
# be reached from here without depending on it. Cycle-free: console depends on
# mcp/registry/dynamic/idl and mcp on cdr/giop/registry/dynamic/idl, and
# nothing in the workspace depends on this crate.
orbweaver-console = { path = "../orbweaver-console" }
orbweaver-mcp = { path = "../orbweaver-mcp" }
# The static half of §8's performance row. `call-bench` compares the generated
# stub against the dynamic path, so it needs the generator's runtime — and the
# generator itself, to prove the checked-in stub it measures is not a fossil.
# Cycle-free: orbweaver-gen depends on cdr/giop/dynamic/registry/idl and on
# nothing here.
orbweaver-gen = { path = "../orbweaver-gen" }

[lints]
workspace = true

# D026 §5 S1b. Serves `CosTrading::Lookup` over the population in
# `corpus/state/`, so `spikes/seed_trading_client.py` can check the wire
# against a stated population instead of against values typed a second time in
# the checking script. Separate from `spike-trading`, which keeps its inline
# offers: a seeded population must not become the only population (D026 §3).
[[bin]]
name = "spike-seeded-trading"
path = "src/bin/spike_seeded_trading.rs"

[[bin]]
name = "contract-check"
path = "src/bin/contract_check.rs"

[[bin]]
name = "wire-fuzz"
path = "src/bin/wire_fuzz.rs"

# The same question at the other untrusted boundary. A separate binary rather
# than a flag on `wire-fuzz`, because the two report different reach over
# different targets and a combined green would hide which half was measured.
[[bin]]
name = "agent-fuzz"
path = "src/bin/agent_fuzz.rs"

# `docs/PLAN.md` §8's performance row, which has been cited since v0.2 with
# nothing behind it. Separate from the fuzz binaries because it answers a
# different kind of question: those ask whether a path survives, this asks what
# it costs, and a combined exit code would let one hide the other.
[[bin]]
name = "call-bench"
path = "src/bin/call_bench.rs"
