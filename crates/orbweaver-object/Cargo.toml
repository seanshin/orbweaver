[package]
name = "orbweaver-object"
description = "CORBA object model: POA, object references as values, pseudo-operations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
orbweaver-cdr = { path = "../orbweaver-cdr" }
orbweaver-giop = { path = "../orbweaver-giop", default-features = false }
orbweaver-registry = { path = "../orbweaver-registry" }
# The residency state machine's states and commands (PLAN-MOE §3 F3). This
# direction is the cycle-free one: orbweaver-trading depends on nothing of
# ours, deliberately, and the POA is where a loader has to live.
orbweaver-trading = { path = "../orbweaver-trading" }

orbweaver-idl = { path = "../orbweaver-idl" }

[[bin]]
name = "spike-server"
path = "src/bin/spike_server.rs"

[[bin]]
name = "spike-experts"
path = "src/bin/spike_experts.rs"

[lints]
workspace = true
