[package]
name = "orbweaver-object"
description = "CORBA object model: POA, object references as values, pseudo-operations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
orbweaver-cdr = { path = "../orbweaver-cdr" }
orbweaver-giop = { path = "../orbweaver-giop", default-features = false }
orbweaver-registry = { path = "../orbweaver-registry" }
# The residency state machine's states and commands (PLAN-MOE §3 F3). This
# direction is the cycle-free one: orbweaver-trading depends on nothing of
# ours, deliberately, and the POA is where a loader has to live.
orbweaver-trading = { path = "../orbweaver-trading" }

orbweaver-idl = { path = "../orbweaver-idl" }
# D026 §5 S1's migration: `spike_tenants` and `spike_experts` load their
# population from `corpus/state/` instead of retyping it, and the seed loader
# parses with `orbweaver_dynamic::json` because the workspace has no serde.
# Cycle-free in this direction only: `orbweaver-dynamic` depends on cdr, giop,
# registry and idl — all of which this crate already depends on — and on
# nothing here. See `src/bin/spike_tenants.rs`, *Where the loader lives*, for
# why the loader is reached by `#[path]` rather than by `use`.
orbweaver-dynamic = { path = "../orbweaver-dynamic" }

[[bin]]
name = "spike-server"
path = "src/bin/spike_server.rs"

[[bin]]
name = "spike-experts"
path = "src/bin/spike_experts.rs"

[[bin]]
name = "spike-tenants"
path = "src/bin/spike_tenants.rs"

# spikes/wide.idl from our own stack, both seats (spikes/wide_rust.sh).
[[bin]]
name = "spike-wide"
path = "src/bin/spike_wide.rs"

[lints]
workspace = true
