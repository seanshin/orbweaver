[package]
name = "orbweaver-registry"
description = "Type registry: repository ids, inheritance, and TypeCodes derived from IDL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
orbweaver-idl = { path = "../orbweaver-idl" }
orbweaver-giop = { path = "../orbweaver-giop", default-features = false }
orbweaver-cdr = { path = "../orbweaver-cdr" }

[lints]
workspace = true

[[bin]]
name = "registry-check"
path = "src/bin/registry_check.rs"

[[bin]]
name = "spike-evolution"
path = "src/bin/spike_evolution.rs"

[[bin]]
name = "idl-diff"
path = "src/bin/idl_diff.rs"

[[bin]]
name = "spike-ifr"
path = "src/bin/spike_ifr.rs"

[[bin]]
name = "spike-ingest"
path = "src/bin/spike_ingest.rs"

[[bin]]
name = "repository-ids"
path = "src/bin/repository_ids.rs"
