[package]
name = "orbweaver-gen"
description = "Static generation from the registry: Rust stubs and skeletons, Python clients, each oracle-checked against the dynamic path"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
orbweaver-cdr = { path = "../orbweaver-cdr" }
orbweaver-giop = { path = "../orbweaver-giop", default-features = false }
orbweaver-dynamic = { path = "../orbweaver-dynamic" }
orbweaver-registry = { path = "../orbweaver-registry" }
orbweaver-idl = { path = "../orbweaver-idl" }

# The same crates, again: an integration test links the crate under test plus
# its dev-dependencies, never its dependencies. The wire test drives a generated
# skeleton over real GIOP, so it needs the framing surface directly.
[dev-dependencies]
orbweaver-cdr = { path = "../orbweaver-cdr" }
orbweaver-giop = { path = "../orbweaver-giop", default-features = false }
orbweaver-idl = { path = "../orbweaver-idl" }
orbweaver-registry = { path = "../orbweaver-registry" }

[lints]
workspace = true

[[bin]]
name = "gen-corpus"
path = "src/bin/gen_corpus.rs"

[[bin]]
name = "gen-python"
path = "src/bin/gen_python.rs"

# The Python target's seam. A separate process rather than an extension module:
# the wire stays in Rust and CPython gains no dependency. See
# docs/decisions/D007-python-wire-seam.md, which is PROPOSED.
[[bin]]
name = "orbweaver-py-bridge"
path = "src/bin/py_bridge.rs"
