[package]
name = "orbweaver-console"
description = "The operator's three questions — catalog, contract diff, traces — rendered as static HTML or plain text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# No web framework, no template engine, no serialiser. The console renders what
# other crates already decided, and every one of those crates is in this
# workspace: `cargo tree` stays at two external crates (cfg-if, encoding_rs),
# which is the same bar D004 held observability to.
[dependencies]
orbweaver-registry = { path = "../orbweaver-registry" }
orbweaver-mcp = { path = "../orbweaver-mcp" }
# For `Ior::parse` alone — a peer reference an operator hands the catalog page
# so it can carry that peer's CSIv2 capability record. Default features off:
# no TLS, no cryptography, nothing external.
orbweaver-giop = { path = "../orbweaver-giop", default-features = false }
orbweaver-dynamic = { path = "../orbweaver-dynamic" }
orbweaver-idl = { path = "../orbweaver-idl" }

[dev-dependencies]
# The tests fabricate an IOR that advertises a CSIv2 mechanism list — the
# negative control for the per-peer record — and need the encoder to do it.
orbweaver-cdr = { path = "../orbweaver-cdr" }

[lints]
workspace = true

[[bin]]
name = "orbweaver-console"
path = "src/bin/orbweaver_console.rs"
